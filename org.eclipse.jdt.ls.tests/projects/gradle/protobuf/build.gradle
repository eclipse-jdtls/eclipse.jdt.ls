buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'

    }
}

apply plugin: 'java'
apply plugin: "com.google.protobuf"
apply plugin: 'eclipse'

group 'com.jdtls.protobuf.test'
version '1.0-SNAPSHOT'
java {
    sourceCompatibility = '11'
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:3.21.4'
}

repositories {
    mavenCentral()
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.21.4'
    }
}
